name: CodeQL

# docs/SECURITY.md G11: static analysis (SAST) of both apps' TypeScript on
# every push and pull request, plus weekly so new queries run on old code.
# Results appear under Security > Code scanning. If the repository also has
# CodeQL "default setup" switched on, switch that off: GitHub refuses
# uploads from both at once.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Upload the results to code scanning.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          # security-extended adds the lower-precision security queries.
          queries: security-extended
          config: |
            paths:
              - backend/src
              - frontend/src
            paths-ignore:
              - "**/node_modules/**"

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
