name: Auth flow CI/CD

# Guards the core API end to end: lint + build both apps, run the backend
# integration tests (auth + TOR CRUD + match scoring + company profile/approval
# + saved TORs + notifications) against a real MongoDB, then prove the
# deployable Docker images still build.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/auth.yml"
      - ".github/scripts/**"
      - "docs/security/cryptography.md"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/auth.yml"
      - ".github/scripts/**"
      - "docs/security/cryptography.md"
  workflow_dispatch:

# Least privilege for the CI token: the jobs only read the code (CodeQL
# actions/missing-workflow-permissions). Actions are pinned to commit SHAs so
# a moved tag can't change what runs; Dependabot keeps the pins current.
permissions:
  contents: read

concurrency:
  group: auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-auth:
    name: Backend · signup/login integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      MONGODB_URI: mongodb://localhost:27017/torr_ci
      SESSION_SECRET: ci-test-secret-not-for-production
      SEED_DEMO_DATA: "true"
      FRONTEND_ORIGIN: http://localhost:3000
      # Keep the e-GP importer and Vertex AI completely idle in CI.
      EGP_POLL_MINUTES: "0"
      EGP_POLL_ON_STARTUP: "false"
      VERTEX_PROJECT_ID: ""
      # Fake LINE credentials: line-link.e2e.test.mjs signs webhook calls with
      # this secret. The backend's chat replies go nowhere (bad token, ignored).
      LINE_CHANNEL_ACCESS_TOKEN: ci-line-token
      LINE_CHANNEL_SECRET: ci-line-secret
      LINE_BOT_ID: "@torfinder-ci"
      # Kept low so line-link.e2e.test.mjs can reach it quickly; that test
      # floods from its own X-Forwarded-For address and sizes itself off this.
      LINE_WEBHOOK_THROTTLE_LIMIT: "40"
      # Generous general limit so the full suite fits one 60s window; only the
      # auth brute-force test cares about the (separate, tighter) login limit.
      THROTTLE_LIMIT: "300"
      # The auth and OAuth brute-force tests size their own request counts off
      # this value (see auth.e2e.test.mjs / oauth.e2e.test.mjs), so raising it
      # doesn't weaken those assertions — it only changes how many requests
      # they need to send to still prove a 429 shows up. It has to stay above
      # the number of *legitimate* /auth/login and /auth/signup calls the rest
      # of the suite makes across every file sharing this one backend process
      # (account-links, accounts, roles, saved-tors, ...); at 30 that budget
      # was already exhausted by files that run alphabetically before
      # auth.e2e.test.mjs, well before its own brute-force test ever ran.
      AUTH_THROTTLE_LIMIT: "300"
      AUTH_THROTTLE_TTL_MS: "60000"
      E2E_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # ASVS 15.2.1: a high or critical advisory in a shipped package fails the
      # build, enforcing the patch SLA in docs/security/asvs-l1.md. The only
      # way past one is a reasoned, dated entry in .github/audit-exceptions.json.
      - name: Audit production dependencies
        run: node ../.github/scripts/npm-audit.mjs backend

      - name: Lint
        run: npm run lint

      # ASVS 11.1.3: every use of cryptography in backend/src and frontend/src
      # is listed in docs/security/cryptography.md, or this fails.
      - name: Cryptography inventory
        run: node ../.github/scripts/check-crypto-inventory.mjs

      # ASVS 1.3.12: every regular expression in both apps is proved free of
      # exponential and polynomial backtracking (recheck).
      - name: ReDoS check
        run: node ../.github/scripts/check-redos.mjs

      - name: Build
        run: npm run build

      - name: Start backend
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          exit 1

      - name: Run integration tests (auth + TOR CRUD + match scoring + profile/approval + saved TORs + notifications)
        run: npm run test:e2e

      - name: Backend log
        if: always()
        run: cat backend.log || true

      - name: Stop backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true

  frontend-auth:
    name: Frontend · auth routes lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://localhost:4000
      SESSION_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same rule as the backend (ASVS 15.2.1), with the same exceptions file.
      - name: Audit production dependencies
        run: node ../.github/scripts/npm-audit.mjs frontend

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-images:
    name: Build deployable images
    runs-on: ubuntu-latest
    needs: [backend-auth, frontend-auth]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build backend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./backend
          push: false
          tags: torfinder-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: ./frontend
          push: false
          tags: torfinder-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
