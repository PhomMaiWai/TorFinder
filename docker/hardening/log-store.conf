# The log store (ASVS 16.4.2, 16.4.3): a separate system the application can't
# reach. Docker's fluentd logging driver sends each container's lines here;
# they are appended to files in this container's own volume, which no other
# container mounts. Its only interface takes new records: nothing can change
# or delete one through it.
[SERVICE]
    flush        1
    log_level    info

[INPUT]
    name         forward
    listen       0.0.0.0
    port         24224

[OUTPUT]
    name         file
    match        *
    path         /logs
    format       plain
