# The HTTPS edge for a deployment: Caddy in front of the frontend.
#
#   docker compose -f docker-compose.yml -f docker-compose.edge.yml up -d --build
#
# Set SITE_ADDRESS (your domain) and FRONTEND_ORIGIN=https://<domain>
# in .env first; see docs/operations/deployment-checklist.md, "HTTPS edge".
# A local `docker compose up` doesn't use this file and is unchanged.
services:
  frontend:
    # Caddy shares this container's network namespace, so the public ports are
    # published here and Next.js listens on loopback only: nothing but Caddy
    # can reach it, and the Caddy-to-Next.js hop never crosses a network
    # (ASVS 12.3.5). The local development port 3000 is dropped.
    ports: !override
      - "${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_HTTPS_PORT:-443}:443"
      - "${EDGE_HTTPS_PORT:-443}:443/udp"
    command: ["node_modules/.bin/next", "start", "-H", "127.0.0.1", "-p", "3000"]

  proxy:
    image: caddy:2.11.8
    network_mode: "service:frontend"
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:-localhost}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    restart: unless-stopped

volumes:
  # Certificates and keys Caddy obtains; kept across restarts so it doesn't
  # ask the certificate authority again.
  caddy_data:
  caddy_config:
