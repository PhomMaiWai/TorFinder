<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TorFinder trust boundaries</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Skin matches the slide deck: deep teal ink, vermilion accent, white paper. */
    :root {
      --color-paper:  #ffffff;
      --color-ink:    #0b3d3a;
      --color-muted:  #4a6b68;
      --color-accent: #e4572e;
      --font-sans: 'Helvetica Neue', Arial, sans-serif;
      --font-mono: Menlo, 'Courier New', monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink);
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1280px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: Cambria, Georgia, serif; font-size: 2rem; font-weight: 400; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Trust boundaries</p>
    <h1>Where TorFinder enforces security</h1>

    <svg viewBox="0 72 1280 568" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="trust-boundaries-title trust-boundaries-desc">
      <title id="trust-boundaries-title">TorFinder trust boundaries</title>
      <desc id="trust-boundaries-desc">The browser reaches only the Next.js frontend, which forwards to the NestJS API on the same host; the API alone talks to MongoDB and to Google, notification services, procurement portals and Vertex AI.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a6b68"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#e4572e"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#ffffff"/>

      <!-- Zones -->
      <rect x="40" y="88" width="240" height="480" rx="8" fill="rgba(11,61,58,0.02)" stroke="rgba(11,61,58,0.16)" stroke-width="0.8"/>
      <rect x="104" y="92" width="112" height="16" rx="2" fill="#ffffff"/>
      <text x="160" y="104" fill="rgba(11,61,58,0.60)" font-size="12" font-family="Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">INTERNET</text>

      <rect x="320" y="88" width="540" height="480" rx="8" fill="rgba(228,87,46,0.03)" stroke="rgba(228,87,46,0.55)" stroke-width="1" stroke-dasharray="4,4"/>
      <rect x="500" y="92" width="180" height="16" rx="2" fill="#ffffff"/>
      <text x="590" y="104" fill="#e4572e" font-size="12" font-family="Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">SERVER HOST</text>

      <rect x="900" y="88" width="340" height="480" rx="8" fill="rgba(11,61,58,0.02)" stroke="rgba(11,61,58,0.16)" stroke-width="0.8"/>
      <rect x="980" y="92" width="180" height="16" rx="2" fill="#ffffff"/>
      <text x="1070" y="104" fill="rgba(11,61,58,0.60)" font-size="12" font-family="Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">EXTERNAL SERVICES</text>

      <!-- Arrows (before nodes) -->
      <!-- Browser -> Next.js -->
      <line x1="240" y1="340" x2="348" y2="340" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <rect x="252" y="304" width="88" height="16" rx="2" fill="#ffffff"/>
      <text x="296" y="316" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">HTTPS</text>
      <!-- Next.js -> NestJS -->
      <line x1="536" y1="340" x2="612" y2="340" stroke="#e4572e" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="540" y="304" width="68" height="16" rx="2" fill="#ffffff"/>
      <text x="574" y="316" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">BEARER</text>
      <!-- NestJS -> MongoDB -->
      <line x1="716" y1="380" x2="716" y2="456" stroke="#4a6b68" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="728" y="408" width="88" height="16" rx="2" fill="#ffffff"/>
      <text x="732" y="420" fill="#4a6b68" font-size="12" font-family="Menlo, monospace">127.0.0.1</text>
      <!-- NestJS -> external services: fanned attach points on the right edge -->
      <path d="M 816,316 H 832 Q 840,316 840,308 V 180 Q 840,172 848,172 H 936" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 816,332 H 848 Q 856,332 856,324 V 288 Q 856,280 864,280 H 936" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 816,348 H 880 Q 888,348 888,356 V 380 Q 888,388 896,388 H 936" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <path d="M 816,364 H 864 Q 872,364 872,372 V 488 Q 872,496 880,496 H 936" fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

      <!-- Nodes -->
      <!-- Browser (user) -->
      <rect x="80" y="296" width="160" height="88" rx="6" fill="#ffffff"/>
      <rect x="80" y="296" width="160" height="88" rx="6" fill="rgba(74,107,104,0.10)" stroke="#8aa3a0" stroke-width="1"/>
      <text x="160" y="336" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Browser</text>
      <text x="160" y="360" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">3 roles + guests</text>

      <!-- Next.js frontend (focal) -->
      <rect x="352" y="280" width="184" height="120" rx="6" fill="#ffffff"/>
      <rect x="352" y="280" width="184" height="120" rx="6" fill="#fce9e3" stroke="#e4572e" stroke-width="1.2"/>
      <text x="444" y="316" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Next.js frontend</text>
      <text x="444" y="340" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">nonce CSP · HSTS</text>
      <text x="444" y="360" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">__Host- cookie</text>
      <text x="444" y="380" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">role gate · idle 30m</text>

      <!-- NestJS API (focal) -->
      <rect x="616" y="280" width="200" height="120" rx="6" fill="#ffffff"/>
      <rect x="616" y="280" width="200" height="120" rx="6" fill="#fce9e3" stroke="#e4572e" stroke-width="1.2"/>
      <text x="716" y="316" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">NestJS API</text>
      <text x="716" y="340" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">role guards · own data</text>
      <text x="716" y="360" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">DTO whitelist</text>
      <text x="716" y="380" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">rate limits · logs</text>

      <!-- MongoDB (store) -->
      <rect x="616" y="460" width="200" height="72" rx="6" fill="#ffffff"/>
      <rect x="616" y="460" width="200" height="72" rx="6" fill="rgba(11,61,58,0.05)" stroke="#4a6b68" stroke-width="1"/>
      <text x="716" y="492" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">MongoDB 7</text>
      <text x="716" y="512" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">GridFS company files</text>

      <!-- External services -->
      <rect x="940" y="140" width="260" height="64" rx="6" fill="#ffffff"/>
      <rect x="940" y="140" width="260" height="64" rx="6" fill="rgba(11,61,58,0.03)" stroke="rgba(11,61,58,0.30)" stroke-width="1"/>
      <text x="1070" y="168" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Google sign-in</text>
      <text x="1070" y="188" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">ID token verified</text>

      <rect x="940" y="248" width="260" height="64" rx="6" fill="#ffffff"/>
      <rect x="940" y="248" width="260" height="64" rx="6" fill="rgba(11,61,58,0.03)" stroke="rgba(11,61,58,0.30)" stroke-width="1"/>
      <text x="1070" y="276" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Resend · LINE · Slack</text>
      <text x="1070" y="296" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">signed LINE webhook</text>

      <rect x="940" y="356" width="260" height="64" rx="6" fill="#ffffff"/>
      <rect x="940" y="356" width="260" height="64" rx="6" fill="rgba(11,61,58,0.03)" stroke="rgba(11,61,58,0.30)" stroke-width="1"/>
      <text x="1070" y="384" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Procurement portals</text>
      <text x="1070" y="404" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">e-GP · MEA · data.go.th</text>

      <rect x="940" y="464" width="260" height="64" rx="6" fill="#ffffff"/>
      <rect x="940" y="464" width="260" height="64" rx="6" fill="rgba(11,61,58,0.02)" stroke="rgba(11,61,58,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <text x="1070" y="492" fill="#0b3d3a" font-size="16" font-weight="600" font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">Gemini on Vertex AI</text>
      <text x="1070" y="512" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" text-anchor="middle">optional</text>

      <!-- Legend -->
      <line x1="40" y1="592" x2="1240" y2="592" stroke="rgba(11,61,58,0.12)" stroke-width="0.8"/>
      <text x="40" y="620" fill="#4a6b68" font-size="12" font-family="Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
      <rect x="160" y="608" width="16" height="16" rx="3" fill="#fce9e3" stroke="#e4572e" stroke-width="1"/>
      <text x="184" y="620" fill="#0b3d3a" font-size="12" font-family="Helvetica Neue, Arial, sans-serif">Enforces security</text>
      <rect x="360" y="608" width="16" height="16" rx="3" fill="none" stroke="#e4572e" stroke-width="1" stroke-dasharray="3,3"/>
      <text x="384" y="620" fill="#0b3d3a" font-size="12" font-family="Helvetica Neue, Arial, sans-serif">Trust boundary (ports on 127.0.0.1)</text>
      <line x1="640" y1="616" x2="672" y2="616" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <text x="684" y="620" fill="#0b3d3a" font-size="12" font-family="Helvetica Neue, Arial, sans-serif">HTTPS call</text>
      <rect x="800" y="608" width="16" height="16" rx="3" fill="rgba(11,61,58,0.05)" stroke="#4a6b68" stroke-width="1"/>
      <text x="824" y="620" fill="#0b3d3a" font-size="12" font-family="Helvetica Neue, Arial, sans-serif">Data store</text>
    </svg>
  </div>
</body>
</html>
