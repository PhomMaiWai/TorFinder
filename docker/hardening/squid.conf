# The only way out of the backend's network (ASVS 13.2.5): HTTPS to the hosts
# TorFinder actually calls, nothing else. A new outside service is added here
# on purpose, or its calls fail.
http_port 3128

acl allowed_hosts dstdomain egp2.bangkok.go.th process5.gprocurement.go.th procurement.mea.or.th
acl allowed_hosts dstdomain api.resend.com api.line.me
# Google sign-in token checks and Vertex AI.
acl allowed_hosts dstdomain .googleapis.com

acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT allowed_hosts
http_access deny all

# Nothing is cached: the proxy only decides who may go out.
cache deny all
# One line per request, allowed or refused (read it with
# `docker compose ... exec egress tail /var/log/squid/access.log`).
access_log stdio:/var/log/squid/access.log
logfile_rotate 0
