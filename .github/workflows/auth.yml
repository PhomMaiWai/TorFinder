name: Auth flow CI/CD

# Guards the core API end to end: lint + build both apps, run the backend
# integration tests (auth + TOR CRUD + match scoring) against a real MongoDB,
# then prove the deployable Docker images still build.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/auth.yml"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - ".github/workflows/auth.yml"
  workflow_dispatch:

concurrency:
  group: auth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-auth:
    name: Backend · signup/login integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      MONGODB_URI: mongodb://localhost:27017/torr_ci
      SESSION_SECRET: ci-test-secret-not-for-production
      SEED_DEMO_DATA: "true"
      FRONTEND_ORIGIN: http://localhost:3000
      # Keep the e-GP importer and Vertex AI completely idle in CI.
      EGP_POLL_MINUTES: "0"
      EGP_POLL_ON_STARTUP: "false"
      VERTEX_PROJECT_ID: ""
      # Generous general limit so the full suite fits one 60s window; only the
      # auth brute-force test cares about the (separate, tighter) login limit.
      THROTTLE_LIMIT: "300"
      # The auth and OAuth integration tests rely on this exact limit for their
      # brute-force assertions (each auth route has its own limiter bucket).
      AUTH_THROTTLE_LIMIT: "30"
      AUTH_THROTTLE_TTL_MS: "60000"
      E2E_BASE_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Start backend
        run: |
          nohup node dist/main.js > backend.log 2>&1 &
          echo $! > backend.pid

      - name: Wait for /health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4000/health; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not become healthy in time"
          exit 1

      - name: Run integration tests (auth + TOR CRUD + match scoring)
        run: npm run test:e2e

      - name: Backend log
        if: always()
        run: cat backend.log || true

      - name: Stop backend
        if: always()
        run: kill "$(cat backend.pid)" 2>/dev/null || true

  frontend-auth:
    name: Frontend · auth routes lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      BACKEND_URL: http://localhost:4000
      SESSION_SECRET: ci-test-secret-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  docker-images:
    name: Build deployable images
    runs-on: ubuntu-latest
    needs: [backend-auth, frontend-auth]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: torfinder-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          tags: torfinder-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
