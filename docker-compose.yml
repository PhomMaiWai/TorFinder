# Container logs (which hold the JSON security events) are kept to 5 files of
# 10 MB per service, oldest dropped first (ASVS 14.2.7; see
# docs/operations/limits-and-retention.md). Ship them elsewhere to keep longer.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  frontend:
    logging: *logging
    build:
      context: ./frontend
      args:
        # Baked into the client bundle at build time — see frontend/Dockerfile.
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    # Every port is bound to this machine only (ASVS 12.2.1): nothing is served
    # to the network over plain HTTP. On a server, put an HTTPS reverse proxy
    # (Caddy, nginx, the host's load balancer) in front of 127.0.0.1:3000.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # ASVS 12.3.5: HTTPS with the frontend's client certificate (made by the
      # certs service); the backend accepts no other caller.
      - BACKEND_URL=https://backend:4000
      - INTERNAL_TLS_CERT_FILE=/certs/frontend.crt
      - INTERNAL_TLS_KEY_FILE=/certs/frontend.key
      - INTERNAL_TLS_CA_FILE=/certs/ca.crt
      # No fallback on purpose: the image runs with NODE_ENV=production and
      # refuses a missing or published secret. Set it in .env (see .env.example).
      - SESSION_SECRET=${SESSION_SECRET:-}
      # Only during a rotation (docs/operations/limits-and-retention.md); must match the backend.
      - SESSION_SECRET_PREVIOUS=${SESSION_SECRET_PREVIOUS:-}
      - SESSION_SECRET_PREVIOUS_UNTIL=${SESSION_SECRET_PREVIOUS_UNTIL:-}
      # Must match the backend's value (docs/security/passkeys.md).
      - STAFF_PASSKEYS_REQUIRED=${STAFF_PASSKEYS_REQUIRED:-false}
      - COMPANY_PASSKEYS_REQUIRED=${COMPANY_PASSKEYS_REQUIRED:-false}
    volumes:
      - certs_frontend:/certs:ro
    depends_on:
      - backend
    # A crashed process comes back by itself (ASVS 16.5.4; see backend main.ts).
    restart: unless-stopped

  backend:
    build: ./backend
    logging: *logging
    # Browsers never call the backend; the frontend reaches it as backend:4000.
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      # The app's own account (readWrite on `torr` only, made by db-users below),
      # not root (ASVS 13.2.2), logged in with the backend's TLS client
      # certificate instead of a password (MONGODB-X509, ASVS 12.3.5).
      - MONGODB_URI=mongodb://db:27017/torr?tls=true&tlsCAFile=/certs/ca.crt&tlsCertificateKeyFile=/certs/mongo-client.pem&authMechanism=MONGODB-X509&authSource=%24external&replicaSet=rs0
      # The API is served over HTTPS and requires the frontend's client certificate.
      - INTERNAL_TLS_CERT_FILE=/certs/server.crt
      - INTERNAL_TLS_KEY_FILE=/certs/server.key
      - INTERNAL_TLS_CA_FILE=/certs/ca.crt
      - SESSION_SECRET=${SESSION_SECRET:-}
      - SESSION_SECRET_PREVIOUS=${SESSION_SECRET_PREVIOUS:-}
      - SESSION_SECRET_PREVIOUS_UNTIL=${SESSION_SECRET_PREVIOUS_UNTIL:-}
      - SESSION_SECRET_CREATED=${SESSION_SECRET_CREATED:-}
      # The site's public address; on a server, https://<your domain> (CORS and passkeys use it).
      - FRONTEND_ORIGIN=${FRONTEND_ORIGIN:-http://localhost:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      # Notification channels; each stays off while its keys are empty.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NOTIFY_EMAIL_FROM=${NOTIFY_EMAIL_FROM:-TOR Finder <onboarding@resend.dev>}
      # Testing only: http://mailpit:8025 sends every email to the mailpit
      # service below instead of Resend (start it with --profile mail).
      - MAIL_CATCHER_URL=${MAIL_CATCHER_URL:-}
      - LINE_CHANNEL_ACCESS_TOKEN=${LINE_CHANNEL_ACCESS_TOKEN:-}
      - LINE_CHANNEL_SECRET=${LINE_CHANNEL_SECRET:-}
      - LINE_BOT_ID=${LINE_BOT_ID:-}
      # Off unless .env opts in: the demo accounts' passwords are published in
      # the README, so they must never appear on a reachable server (ASVS 6.3.2).
      - SEED_DEMO_DATA=${SEED_DEMO_DATA:-false}
      # Staff passkeys (docs/security/passkeys.md). Bound to FRONTEND_ORIGIN's
      # host, which on a server must be the public https:// address. Optional
      # unless .env opts in, so a local stack or demo works without a passkey;
      # a real deployment sets STAFF_PASSKEYS_REQUIRED=true (rollout in passkeys.md).
      - STAFF_PASSKEYS_REQUIRED=${STAFF_PASSKEYS_REQUIRED:-false}
      - COMPANY_PASSKEYS_REQUIRED=${COMPANY_PASSKEYS_REQUIRED:-false}
      - STEP_UP_MINUTES=${STEP_UP_MINUTES:-10}
      - ADMIN_APPROVAL_EXPIRY_HOURS=${ADMIN_APPROVAL_EXPIRY_HOURS:-48}
      - FORM_MIN_SECONDS=${FORM_MIN_SECONDS:-2}
      # The backend refuses uploads in production unless ClamAV checks them
      # (docs/SECURITY.md G6). This stack has no ClamAV, so a local demo opts out
      # here; docker-compose.hardening.yml adds ClamAV and turns it back on.
      - VIRUS_SCAN_REQUIRED=${VIRUS_SCAN_REQUIRED:-false}
      # AI document reading (Vertex). Off while VERTEX_PROJECT_ID is empty.
      # Values come from the root .env, never baked into the image.
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-}
      - VERTEX_LOCATION=${VERTEX_LOCATION:-asia-southeast1}
      - VERTEX_MODEL=${VERTEX_MODEL:-gemini-2.5-flash}
      - AI_POLL_MINUTES=${AI_POLL_MINUTES:-60}
      - AI_POLL_ON_STARTUP=${AI_POLL_ON_STARTUP:-false}
      # Daily caps on model calls visitors can trigger (docs/SECURITY.md G1).
      - AI_PROPOSAL_DRAFTS_PER_ACCOUNT_PER_DAY=${AI_PROPOSAL_DRAFTS_PER_ACCOUNT_PER_DAY:-20}
      - AI_PROPOSAL_DRAFTS_PER_DAY=${AI_PROPOSAL_DRAFTS_PER_DAY:-300}
      - AI_SIMILAR_EMBEDS_PER_DAY=${AI_SIMILAR_EMBEDS_PER_DAY:-2000}
      # Points the SDK at the mounted key only when one was given; empty means
      # the SDK never looks for one.
      - GOOGLE_APPLICATION_CREDENTIALS=${VERTEX_CREDENTIALS_FILE:+/run/secrets/gcp-credentials.json}
    volumes:
      - certs_backend:/certs:ro
      # The GCP service-account key (or ADC file) from a path outside the repo,
      # read-only. Unset, an empty placeholder is mounted and never read.
      - ${VERTEX_CREDENTIALS_FILE:-./docker/gcp/none.json}:/run/secrets/gcp-credentials.json:ro
    depends_on:
      db-users:
        condition: service_completed_successfully
    restart: unless-stopped

  # One-shot: makes (or renews) the internal CA and each service's certificate,
  # then exits (docker/certs/generate.sh). Runs on every `up`; idempotent.
  certs:
    image: mongo:7
    # Root only because each key is chown'ed to the uid of the service that
    # reads it (node 1000, mongodb 999, vault 100). Everything else root could
    # do is taken away (docs/SECURITY.md G10): only the file-ownership
    # capabilities remain, no network, and no way to gain more privileges.
    user: root
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes:
      - certs_ca:/certs/ca
      - certs_frontend:/certs/frontend
      - certs_backend:/certs/backend
      - certs_db:/certs/db
      - certs_dev:/certs/dev
      - ./docker/certs:/scripts:ro
      # `docker compose run --rm certs export` copies the dev client cert here.
      - ./docker/certs/dev:/export
    entrypoint: ["sh", "/scripts/generate.sh"]
    restart: "no"

  # One-shot: makes the MongoDB root password on the first `up` and keeps it in
  # the torr_db_secrets volume, so no account has a default password (ASVS
  # 13.2.3; docker/db-secrets/init.sh). The backend needs none: it signs in
  # with its certificate.
  db-secrets:
    image: mongo:7
    environment:
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-}
    volumes:
      - torr_db_secrets:/secrets
      - ./docker/db-secrets:/scripts:ro
    entrypoint: ["sh", "/scripts/init.sh"]
    restart: "no"

  # One-shot: creates or updates the backend's database account, then exits.
  # Runs on every `up` (as root), so an existing volume gets the account too.
  db-users:
    image: mongo:7
    environment:
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-torr}
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:-torr_app}
    volumes:
      - ./docker/mongo-users:/scripts:ro
      - certs_db:/certs:ro
      - torr_db_secrets:/secrets:ro
    entrypoint: ["sh", "/scripts/run.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Testing only, off unless asked for: `docker compose --profile mail up -d`.
  # Catches every email the backend sends (with MAIL_CATCHER_URL set) and
  # shows them at http://localhost:8025 — any address, nothing delivered.
  mailpit:
    image: axllent/mailpit:v1.21
    profiles: [mail]
    logging: *logging
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  db:
    image: mongo:7
    logging: *logging
    # Exposed on this machine only, so the app can also be run straight from
    # the shell (npm run dev) with only the database in Docker.
    ports:
      - "127.0.0.1:27017:27017"
    # The root account is only read when the data volume is first created.
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-torr}
      # The generated one (ASVS 13.2.3), or MONGO_ROOT_PASSWORD from .env.
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/secrets/root-password
    # ASVS 12.3.5: TLS only, and every client must present a certificate from
    # the internal CA (passwords alone, without one, are refused). TLS 1.3 only
    # (ASVS 11.6.2, 12.1.2): every 1.3 suite is forward secret.
    command:
      - --tlsMode=requireTLS
      - --tlsDisabledProtocols=TLS1_0,TLS1_1,TLS1_2
      - --tlsCertificateKeyFile=/certs/db.pem
      - --tlsCAFile=/certs/ca.crt
      # ASVS 2.3.3: a one-member replica set, so a business operation's writes
      # run in one transaction (DatabaseService.transaction). db-users starts
      # it. A replica set with accounts needs a member key: db-secrets makes it.
      - --replSet=rs0
      - --keyFile=/secrets/replica-set-key
    volumes:
      - torr_db_data:/data/db
      - certs_db:/certs:ro
      - torr_db_secrets:/secrets:ro
      # Fills an empty database with a snapshot of real TOR records on first start.
      - ./docker/mongo-seed:/docker-entrypoint-initdb.d:ro
    depends_on:
      certs:
        condition: service_completed_successfully
      db-secrets:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--tls", "--tlsCAFile", "/certs/ca.crt", "--tlsCertificateKeyFile", "/certs/db.pem", "--eval", "db.adminCommand('ping')"]
      interval: 2s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  torr_db_data:
  # The generated MongoDB root password (docker/db-secrets/init.sh).
  torr_db_secrets:
  # One volume per service, so each container holds only its own private key.
  certs_ca:
  certs_frontend:
  certs_backend:
  certs_db:
  certs_dev:
